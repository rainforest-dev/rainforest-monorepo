# Which machine runs which part of the loop.
#
# Roles, not directories. `engine` runs on every machine that executes work, so
# splitting the tree by hostname would mean two copies of the same twelve Python
# files -- and on 2026-07-29 the two installs were found already drifted from
# each other (mini was missing greenlight.py and three modules behind). One copy,
# many hosts, is the whole point.
#
# A hostname is also the least stable fact here: replace the laptop and every
# path changes, while "the company executor" does not. So the roles below are
# named after what a machine does, and this file is the only place that maps a
# machine to them.
#
# Read by install.sh. Adding a host means adding an entry here, not a directory.

roles:
  engine:
    description: loopctl + ralph.sh + the contract. Required by anything that executes.
    installs:
      - engine/ -> ~/.claude/loop/
    note: >
      Brings its own pyproject/uv.lock; install.sh creates the venv. Never
      overwrites config.yaml or greenlight/ -- see "Not in this repo" in README.

  ralph:
    description: The LaunchAgent that drives iterations.
    installs:
      - launchd/<host>.tools.rainforest.loop-ralph.plist
    note: >
      Installed disabled. Enabling an unsupervised executor is a deliberate act,
      never a side effect of running install.sh.

      On rainforest-angible the plist runs engine/run-ralph-gui.applescript
      rather than ralph.sh directly: a launchd job there cannot read
      ~/Library/Mobile Documents (probed 2026-08-25 -- DENIED on Air, permitted
      on mini), and both projects that host runs read notion-tasks.json out of
      the vault. The script ships with the engine role, so no extra install step.

  relay-pull:
    description: >
      Pulls greenlight requests queued by Observatory and applies them through
      loopctl greenlight-apply. Only the machine that OWNS an allowlist runs
      this -- it is the single writer of greenlight/<slug>.md.
    installs:
      - relay/pull.sh -> ~/.local/share/loop-greenlight-pull/
      - launchd/<host>.com.rainforest.greenlight-pull.plist

  usage-hourly:
    description: Hourly quota and ledger refresh.
    installs:
      - launchd/<host>.com.rainforest.usage-hourly.plist
    note: >
      Air additionally needs usage/run-hourly-air.sh, because launchd there is
      denied READ access to iCloud under TCC (writes are allowed) -- a plist
      pointing straight at the iCloud path fails before the script starts, and
      silently. That is a host-specific implementation of a shared role, which
      is why it is a filename and not a directory.

  usage-publish:
    description: Pushes this machine's telemetry to the Observatory host.
    installs:
      - usage/publish-air-to-mini.sh -> ~/.local/share/loop-usage-runtime/
      - launchd/<host>.com.rainforest.usage-air-publish.plist

  telemetry-sink:
    description: >
      Somewhere for this executor's own OTLP to land. Required by any host that
      runs `ralph`, because ralph is what emits it.
    installs:
      - telemetry/<host>.config.alloy -> ~/.config/dev-telemetry/alloy/
      - launchd/<host>.com.homelab.dev-alloy.plist
    note: >
      This is an executor concern, not a homelab one, which is why it lives
      here. `ralph.sh:78` defaults OTLP_ENDPOINT to http://localhost:4318 and
      injects the exporter env into every `claude -p` it launches -- so a
      machine can be a perfectly healthy executor and still throw away
      everything it measures, with no error, because nothing is listening on
      that port. Enrolling an executor has to install its intake or the
      telemetry half of enrolling it did not happen.

      Measured 2026-08-26: the Air had run this way for its whole life. Zero
      `{job="claude-code"}` series in Prometheus and zero lines in Loki carried
      that machine; every series present came from a hand-exported interactive
      shell on the mini. Its Alloy was up and healthy the entire time -- it
      shipped host metrics and dev events fine. It simply had no
      `otelcol.receiver.otlp` block, and the OTel SDK fails silently against a
      closed socket.

      Not installed on rainforest-mini, which is the exception that explains the
      shape: its sink is the homelab's containerised Alloy, provisioned by
      terraform in rainforest-homelab (`modules/grafana-alloy`), and it already
      receives on 4317/4318. Two hosts, two provisioning systems, one role --
      so the role names the requirement and the file names the host.

      The Air's receiver binds 127.0.0.1, not 0.0.0.0 as the mini's does: only
      local producers push to it, and it is a laptop that joins untrusted
      networks. The mini binds wide because its Alloy also serves containers
      across a Docker bridge.

  # observatory: retired 2026-08-27. The app now runs as a container built by
  # .github/workflows/release-loop-observatory.yml, published to
  # ghcr.io/rainforest-dev/loop-observatory and provisioned by terraform in
  # rainforest-homelab (modules/loop-observatory) — the same shape the
  # telemetry-sink note describes for the mini's Alloy.
  #
  # The LaunchAgent ran the app out of ~/loop-observatory-deploy, a checkout
  # pulled by hand. On the day this was retired that checkout sat at #303, nine
  # PRs behind main, and nothing anywhere reported the gap: install.sh installs
  # the plist, and a plist cannot notice that the tree underneath it is stale.
  # An image carries its version, so "which one is deployed" has an answer.
  #
  # The plist on the mini was booted out and `launchctl disable`d rather than
  # deleted, so rolling back is `launchctl enable` plus a bootstrap. The copy in
  # this repo is gone: no role installs it, and a plist that nothing installs is
  # a file that only misleads the next reader.

  loop-sync:
    description: Notion/board sync service that owns provider credentials.
    installs:
      - launchd/<host>.com.rainforest.loop-sync.plist
    note: Reads its tokens from ~/.config/loop/, which is not in this repo.

  # icloud-mirror: retired 2026-08-25. It existed because a launchd job was
  # believed unable to read ~/Library/Mobile Documents under TCC, so vault-authored
  # files were copied into a second checkout that launchd could read, through an
  # AppleScript shim that re-entered the GUI session. Probed with a throwaway
  # LaunchAgent on both machines that day: mini reads the vault directly (41 task
  # files, contents included), so the premise no longer holds there and the clone,
  # the shim and this schedule all go with it. Air is still DENIED -- it keeps its
  # own runtime copy, which is a different mechanism and stays.
  #
  # The mirror also actively hurt: _atomic_copy ends in os.replace, which stamps a
  # fresh mtime whether or not a byte changed, so every downstream freshness check
  # read 4-to-9-day-old data as two minutes old.

# Declarations. Read by install.sh (roles only) and by the Observatory's
# enrollment view, which pairs each entry with the facts that host reported and
# derives its files from the two together.
#
# DECLARED, NEVER PROBED. Everything below is a decision about what a machine
# should be; nothing here is discovered by looking at one. `otlp_bind` is the
# reason the rule is written down: whether a machine opens a port to the network
# must not be a side effect of what a probe happened to find. Omit it and it is
# 127.0.0.1, because the safe value is the one a forgetful entry gets.
#
#   home              required, absolute. Every derived path hangs off it, so it
#                     is never defaulted -- guessing a home directory is the
#                     mistake vault_path() made when it fell through to a
#                     retired clone.
#   scope             company | personal. A company machine resolving `gh` to a
#                     personal account is a drift finding.
#   roles             see the definitions above.
#   otlp_bind         127.0.0.1 (default) | 0.0.0.0.
#   interval_seconds  StartInterval for the ralph LaunchAgent. Default 1800.
hosts:
  rainforest-angible:
    scope: company
    executes: company work only
    home: /Users/rainforest
    # A laptop that joins untrusted networks. Only local producers push to it.
    otlp_bind: 127.0.0.1
    interval_seconds: 1800
    roles:
      [engine, ralph, relay-pull, usage-hourly, usage-publish, telemetry-sink]

  rainforest-mini:
    scope: personal
    executes: personal work only, and hosts Observatory for both
    home: /Users/rainforest
    # Binds wide because its Alloy also serves containers across a Docker bridge.
    otlp_bind: 0.0.0.0
    interval_seconds: 1800
    roles: [engine, ralph, loop-sync, usage-hourly]
