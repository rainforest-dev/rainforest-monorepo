# The trigger has to be `pull_request`. Under `workflow_run` the action
# auto-detects agent mode, and agent mode carries no PR entity — the number
# survives only as text inside the prompt, so the inline-comment tool has
# nothing to attach to. Measured on runs 35709836413 and 35710142935: both
# reported success, both posted nothing, and PRs #85 #86 #87 have zero reviews
# and zero comments between them.
#
# The cost is that `claude-code-action` refuses to run when a workflow file on
# the branch differs from the copy on the default branch, and that refusal
# exits 0 — so a PR editing this file gets a green check and no review. The
# self-modified job below makes that visible instead of silent. A review that
# never posts is worse than one that occasionally announces it skipped.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Read,Glob,Grep"

      - name: Fallback summary
        if: always() && steps.claude-review.outcome != 'success'
        run: |
          {
            echo "## Claude Code Review — did not complete"
            echo
            echo "Check the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"

  self-modified:
    name: Review skipped by workflow validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Warn when this PR edits the review workflow
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD" -- '.github/workflows/claude*.yml')
          if [ -z "$changed" ]; then
            echo "Review workflow untouched; the review job above ran normally."
            exit 0
          fi
          {
            echo "## Claude Code Review — skipped by design"
            echo
            echo "This PR modifies:"
            echo
            echo '```'
            echo "$changed"
            echo '```'
            echo
            echo "\`claude-code-action\` refuses to run when a workflow file differs from the"
            echo "copy on the default branch, and the refusal exits 0 — so the review job's"
            echo "green check above means nothing for this PR. Review these changes by hand,"
            echo "or merge and let the next PR exercise them."
          } >> "$GITHUB_STEP_SUMMARY"
