name: Claude Code Review

# Triggered by CI finishing rather than by the PR itself, for two reasons.
# A `workflow_run` job always executes the copy of this file on the default
# branch, so it is exempt from the action's workflow-validation check — under a
# `pull_request` trigger any PR that touches this file is skipped, and the skip
# exits 0, so the check reports success while no review ran (observed on
# PR #394). It also lets the review wait for CI, so Claude never reviews code
# that does not build.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

concurrency:
  group: claude-review-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    # `workflow_run.pull_requests` is empty for forks, so this also filters
    # those out; this repo takes no external contributions.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      !startsWith(github.event.workflow_run.head_branch, 'ai/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      # Deliberately NOT `ref: workflow_run.head_sha`. A workflow_run job holds
      # secrets and write scope, so checking out the PR's own commit is
      # CodeQL's actions/untrusted-checkout — a PR could then reach the token,
      # and its contents enter the reviewing agent's context. The default
      # branch supplies CLAUDE.md and repo layout; the diff itself comes from
      # the action's PR context, not the working tree.
      - name: Checkout the default branch for repo context
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      - name: Fallback summary
        if: always() && steps.claude-review.outcome != 'success'
        run: |
          {
            echo "## Claude Code Review — did not complete"
            echo
            echo "PR #${{ github.event.workflow_run.pull_requests[0].number }}."
            echo "Check the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"

  skip-review:
    name: Skip Review
    if: >
      github.event.workflow_run.conclusion != 'success' ||
      github.event.workflow_run.event != 'pull_request' ||
      !(github.event.workflow_run.pull_requests[0].number > 0) ||
      startsWith(github.event.workflow_run.head_branch, 'ai/')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report skipped
        run: |
          {
            echo "## Claude Code Review — skipped"
            echo
            echo "- CI conclusion: \`${{ github.event.workflow_run.conclusion }}\`"
            echo "- triggering event: \`${{ github.event.workflow_run.event }}\`"
            echo "- head branch: \`${{ github.event.workflow_run.head_branch }}\`"
            echo
            echo "A review runs only when CI passed on a non-\`ai/\` pull request branch."
          } >> "$GITHUB_STEP_SUMMARY"
