name: Release personal-memories to GHCR

# Automatic release on push to main when personal-memories changes.
# CI: nx release (semver + GitHub Release) → GHCR push via docker/build-push-action.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/personal-memories/**'
      - '.github/workflows/release-personal-memories.yml'
  workflow_dispatch:
    inputs:
      first-release:
        description: 'First release (skips changelog diff check)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/rainforest-dev/personal-memories
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD }}

jobs:
  release-and-push:
    name: Release, Build, and Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: nx release — version and changelog
        id: release
        # `shell: bash` is load-bearing: it adds `-o pipefail`, which the default
        # `bash -e {0}` lacks. Without it the `| tee` below would report tee's exit
        # code and a failed release would go green — the bug this workflow's
        # rss-manager twin shipped for a month.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRST_RELEASE: ${{ inputs.first-release }}
        run: |
          PROJECT='@rainforest-monorepo/personal-memories'
          MANIFEST=./apps/personal-memories/package.json
          # --skip-publish, never --yes: nx rejects the pair as mutually exclusive.
          FLAGS=(--skip-publish --projects="$PROJECT")
          if [ "$FIRST_RELEASE" = "true" ]; then FLAGS+=(--first-release); fi
          pnpm exec nx release "${FLAGS[@]}" 2>&1 | tee /tmp/nx-release.log
          # Read the version nx just wrote to the manifest rather than grepping
          # git tags: releaseTag.pattern renders {projectName}, so the tag reads
          # personal-memories@x.y.z while the package is scoped, and a grep that
          # misses falls through to whatever stale tag exists.
          VERSION=$(node -p "require('$MANIFEST').version")
          if [ -z "${VERSION}" ]; then
            echo "::error::No version resolved. Refusing to publish an image under an empty or stale version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Released: ${VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/personal-memories/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push release tags
        id: push-tags
        continue-on-error: true
        run: git push origin --tags --force

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG_PUSH: ${{ steps.push-tags.outcome }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/rainforest-dev/personal-memories
        run: |
          echo "### personal-memories Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${IMAGE_NAME}:${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Git SHA** | \`${GIT_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag Push** | ${TAG_PUSH} |" >> "$GITHUB_STEP_SUMMARY"
