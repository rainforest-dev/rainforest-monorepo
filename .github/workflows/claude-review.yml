name: Claude Review

# Multi-perspective PR review. The reviewers are this repo's own subagents in
# `.claude/agents/review-*.md`, and REVIEW.md says which of them a PR's changed
# paths call for. The loop runs the same subagents locally before it opens a PR,
# so one definition serves both.
#
# Why `github_token` is passed: without it the action trades an OIDC token for a
# claude[bot] app token, and that exchange refuses (exit 0, no review) whenever
# this file differs from the default branch's copy. With the job's own token
# there is no exchange, so a PR that edits this workflow is reviewed by the
# workflow it proposes. The cost is that comments come from github-actions[bot]
# and `use_sticky_comment` does not work, so the summary edits its own last
# comment instead.
#
# The reviewers themselves always come from the base branch: on a PR the action
# replaces `.claude/` and CLAUDE.md with the base copies, so a PR cannot rewrite
# the reviewer that judges it. It keeps the PR's copies under `.claude-pr/`,
# which the prompt reads only for a reviewer the base branch does not have yet.
#
# It runs on every push so the check always describes the head a ruleset would
# merge, and fails while a blocking finding stands. Findings already posted are
# not posted again. The `claude-review` label reviews the current head again.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

# Any label fires `labeled`, and concurrency is decided before the job's `if`,
# so a label other than `claude-review` gets a group of its own instead of
# cancelling the review in flight.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'claude-review' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    # A run skipped for an unrelated label carries another name, so a ruleset
    # requiring `Claude Review` never counts that skip as a pass.
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'claude-review' && 'Claude Review (not run)' || 'Claude Review' }}
    if: >
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Only a summary written by this run may satisfy the gate, never one the
      # PR committed.
      - name: Remove any committed summary
        run: rm -f .claude-review-summary.md

      - name: Drop the re-run label
        if: github.event.action == 'labeled'
        # A label someone already removed must not stop the review.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label claude-review

      - name: Run the reviewers
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Subagents otherwise start in the background, the orchestrator ends
          # its turn to wait for them, and a headless run exits right there
          # with nothing posted.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Every inline comment is posted by the orchestrator with
          # `confirmed: true` after it has checked the finding itself.
          classify_inline_comments: 'false'
          # Agent sessions push as claude[bot] on some PRs.
          allowed_bots: 'claude'
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            You coordinate a multi-perspective review of this pull request. You
            do not review it yourself; the reviewer subagents do, and you check
            and publish what they find.

            1. Read REVIEW.md at the repository root. It lists the reviewers,
               the paths that call for each, and the repo's review rules.
            2. Run `gh pr view PR --json title,body,headRefName,files` and
               `git diff --stat BASE...HEAD`. Decide which reviewers the changed
               paths call for. `review-correctness` always runs.
            3. Start every chosen reviewer with the Agent tool, all in one
               message so they run in parallel, with `run_in_background: false`,
               using the subagent of the same name. Wait for every reviewer to
               return before step 4: this run ends when your turn does, so
               never end it while a reviewer is still running. If that subagent
               type is not registered because this PR adds it, start a general-purpose
               agent with the instructions from
               `.claude-pr/.claude/agents/<name>.md` instead, and say so in the
               summary. Give each one: the PR
               number, BASE and HEAD, the PR title and body, and the changed
               files that matter to it. Tell it to return findings in the
               format its own instructions define.
            4. Check every finding yourself against the code at HEAD before
               publishing it. Drop it if you cannot trace a concrete path to the
               failure, if it restates a CI or lint check, or if it is about
               code this PR did not change. Merge duplicates across reviewers.
            5. Run `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
               and drop any finding that a github-actions[bot] comment already
               raises at the same path and line, so a re-review does not post
               duplicates. Post each remaining finding as an inline comment with
               `mcp__github_inline_comment__create_inline_comment` and
               `confirmed: true`, on a line inside the diff. Open the body with
               `🔴 blocking` or `🟡 optional`, then the reviewer's name in
               brackets, then the problem, the failure scenario, and the
               suggested fix. Cite the REVIEW.md or CLAUDE.md rule when there
               is one.
            6. Write a summary to `.claude-review-summary.md` at the repository
               root with the Write tool (a shell redirect or a path outside the
               checkout is not allowed; the checkout is never pushed) and post it by
               running exactly this command, which is the only one allowed:
               `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file .claude-review-summary.md`.
               Start it with the line `<!-- claude-review-summary -->`, then
               the line `<!-- claude-review-blocking: N -->` where N is the
               number of blocking findings that still stand at HEAD: the ones
               you posted now plus the ones you skipped in step 5 as already
               posted. Leave one out only when its thread has a reply
               explaining why it is not a problem and you agree. Then a table of each reviewer that ran with its count of blocking and
               optional findings, then any finding you could not anchor to a
               diff line, then the reviewers you skipped and why in one line.
               When nothing survived, say so plainly.

            Never approve, request changes, push, or edit files in the repo.
          claude_args: >-
            --allowedTools
            "Agent,Task,Read,Glob,Grep,Write(./.claude-review-summary.md),Edit(./.claude-review-summary.md),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate),Bash(gh pr diff:*),Bash(gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file .claude-review-summary.md),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"

      - name: Show what the review did
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude-review.outputs.execution_file }}
        # Tool names, tool errors and the final message only, never tool inputs
        # or successful output, so a run that posts nothing can still be
        # diagnosed from the log.
        run: |
          jq -r '
            [.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name] as $tools
            | "tools used: \($tools | join(", "))",
              (.[] | select(.type == "user") | .message.content[]? | select(.type == "tool_result" and .is_error == true) | "tool error: \(.content | tostring | .[0:200])"),
              (.[] | select(.type == "result") | "result: \(.result // "")", "denials: \(.permission_denials // [] | map(.tool_name) | join(", "))")
          ' "$EXEC_FILE" || true

      - name: Fail on blocking findings
        # Without the marker the review did not finish, which must not pass.
        run: |
          n=$(sed -n 's/^<!-- claude-review-blocking: \([0-9][0-9]*\) -->$/\1/p' .claude-review-summary.md 2>/dev/null | head -1)
          if [ -z "$n" ]; then
            echo "::error::The review wrote no result marker, so it did not finish."
            exit 1
          fi
          if [ "$n" -gt 0 ]; then
            echo "::error::$n blocking finding(s) still stand. Fix them, or reply on the thread explaining why not, then push or re-run with the claude-review label."
            exit 1
          fi
          echo "No blocking findings."

      - name: Fallback summary
        if: always() && steps.claude-review.outcome != 'success'
        run: |
          {
            echo "## Claude Review did not complete"
            echo
            echo "Check the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"
