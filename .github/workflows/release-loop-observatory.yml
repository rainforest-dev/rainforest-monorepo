name: Release loop-observatory to GHCR

# Automatic release on push to main when loop-observatory changes.
# Version is CalVer + commit sha, computed here; the image is built and pushed by
# docker/build-push-action. nx release is deliberately not involved: seven of the
# faults found on 2026-08-27 came from it, and the two things it offered that are
# wanted here (a version and a tag) are three lines of shell.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/loop-observatory/**'
      # Baked into the image by apps/loop-observatory/Dockerfile. Without this a
      # declaration change would never reach a running container, and the app
      # would be debugged against a stale hosts.yaml.
      - 'tools/loop/hosts.yaml'
      # Built into the image (`nx build rainforest-ui`) before the app itself.
      - 'libs/rainforest-ui/**'
      - '.github/workflows/release-loop-observatory.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/rainforest-dev/loop-observatory

jobs:
  release-and-push:
    name: Release, Build, and Push to GHCR
    # Native arm64, not ubuntu-latest. The first build of this image ran
    # linux/amd64 to completion and left linux/arm64 still inside `pnpm install`
    # when the job hit the 6-hour ceiling: arm64 on an amd64 runner goes through
    # QEMU, and 2245 packages plus an nx and an astro build do not survive that.
    # Free for public repositories.
    runs-on: ubuntu-24.04-arm
    # A build that takes longer than this is stuck, and six hours is an expensive
    # way to find that out.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # No node, pnpm or nx on the runner: everything the image needs is built
      # inside the Dockerfile, and `pnpm install --frozen-lockfile` out here was
      # only ever feeding nx release.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: release
        shell: bash
        run: |
          # CalVer plus the commit, the same scheme the company monorepo uses for
          # its container images. Two properties matter here and semver had
          # neither:
          #
          #   Unique by construction. Nothing has to look up "what was the last
          #   version" -- the question that failed in four different ways before
          #   this, most recently by resolving a tag whose commit was never
          #   pushed and so existed on no branch.
          #
          #   Independent of commit type. This workflow fires on paths, while
          #   semver bumps on feat/fix. #320 was a `chore` that edited
          #   tools/loop/hosts.yaml -- which the image bakes, so the container
          #   could not see the new declarations until it was rebuilt. The
          #   trigger said release, semver said no bump, and the run died on a
          #   tag collision. A version derived from the commit cannot disagree
          #   with the thing that triggered the build.
          VERSION="$(date -u +%Y.%m.%d).$(git rev-parse --short=8 HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building ${VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/loop-observatory/Dockerfile
          # arm64 only, matching the runner above. Every consumer of this image is
          # arm64 — the mini that hosts it and the raspberrypi-5 beside it — so a
          # second architecture would double the build to serve nobody. Add a
          # matrix with a manifest merge if an amd64 host ever appears.
          platforms: linux/arm64
          push: true
          # :latest is a convenience pointer for humans and moves every build.
          # Nothing deploys from it -- terraform pins the exact version, which is
          # the difference that lets a bad release be rolled back.
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the commit this image was built from
        id: push-tags
        continue-on-error: true
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # One tag, on HEAD, pushed by name. The previous `git push origin
          # --tags --force` pushed every tag in the checkout and could move any
          # of them; it also relied on nx release to have created one, which
          # this workflow no longer does.
          git tag "loop-observatory@${VERSION}"
          git push origin "loop-observatory@${VERSION}"

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG_PUSH: ${{ steps.push-tags.outcome }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/rainforest-dev/loop-observatory
        run: |
          echo "### loop-observatory Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${IMAGE_NAME}:${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Git SHA** | \`${GIT_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag Push** | ${TAG_PUSH} |" >> "$GITHUB_STEP_SUMMARY"
