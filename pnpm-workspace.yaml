packages:
  - apps/*
  - libs/*

catalog:
  '@material/material-color-utilities': ^0.3.0
  '@tailwindcss/typography': ^0.5.19
  '@tailwindcss/vite': 4.2.2
  vite: 8.3.5
  '@types/node': ^25.0.10
  '@types/react': 19.2.9
  '@types/react-dom': 19.2.3
  lit: 3.3.2
  next: 16.4.2
  react: 19.2.3
  react-dom: 19.2.3
  tailwindcss: 4.2.2
  typescript: 6.0.3
  class-variance-authority: ^0.7.1
  tailwind-merge: ^3.5.0

# pnpm 11 settings (moved from package.json pnpm field)
peerDependencyRules:
  allowedVersions:
    # @vite-pwa/astro's published peer range lags Astro's releases; it works
    # with Astro 6/7 in practice, so allow both explicitly.
    '@vite-pwa/astro>astro': '6 || 7'
    '@nanostores/lit>nanostores': '1'

minimumReleaseAge: 1440

allowBuilds:
  '@parcel/watcher': true
  # Only used for source-map upload, which we keep disabled (personal-website's
  # astro.config.mjs) — skip its binary-downloading postinstall.
  '@sentry/cli': false
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  es5-ext: true
  esbuild: true
  # Optional vite peer; its postinstall is not needed to compile anything here.
  less: false
  msw: true
  nx: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Security overrides (Oct 2026 CVE review). Each pins a transitive dependency
# whose parent has no patched release yet; drop an entry once the parent catches up.
overrides:
  # epubjs 0.3.93 (latest) pins 0.7.x: GHSA-w2rr-34g9-rvrj and 14 others
  '@xmldom/xmldom@<0.8.15': ^0.8.15
  # verdaccio 6.x: GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f
  handlebars@<4.7.10: ^4.7.10
  # astro-compress 2.4.3 (latest): librsvg CVE-2026-96889, SVGO removeScripts bypass
  sharp@<0.35.5: ^0.35.5
  svgo@>=4 <4.1.0: ^4.1.0
  # Patch-level fixes for packages their parents pin exactly (nx, verdaccio,
  # express, @vercel/*, e2e tooling). All are same-major bumps.
  undici@>=7 <7.30.1: ^7.30.1
  zod@>=4 <4.6.6: ^4.6.7
  js-yaml@>=4 <4.3.2: ^4.3.2
  lodash@<4.17.24: ^4.18.1
  minimatch@>=7 <7.4.8: ^7.4.9
  path-to-regexp@>=4 <6.3.0: ^6.3.0
  body-parser@<1.20.9: ^1.20.9
  body-parser@>=2 <2.4.0: ^2.4.0
  compression@<1.8.2: ^1.8.2
  qs@<6.16.1: ^6.16.1
  ajv@>=8 <8.18.0: ^8.18.0
  postcss-selector-parser@<6.1.5: ^6.1.5
  serialize-javascript@<7.1.3: ^7.1.3
