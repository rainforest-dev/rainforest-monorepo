packages:
  - apps/*
  - libs/*

catalog:
  '@material/material-color-utilities': ^0.4.0
  '@tailwindcss/typography': ^0.5.20
  '@tailwindcss/vite': 4.3.3
  vite: 8.3.2
  '@types/node': ^26.6.4
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  lit: 3.3.3
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  class-variance-authority: ^0.7.1
  tailwind-merge: ^3.7.0

# pnpm 11 settings (moved from package.json pnpm field)
peerDependencyRules:
  allowedVersions:
    # @vite-pwa/astro's published peer range lags Astro's releases; it works
    # with Astro 6/7 in practice, so allow both explicitly.
    '@vite-pwa/astro>astro': '6 || 7'
    '@nanostores/lit>nanostores': '1'

minimumReleaseAge: 1440

allowBuilds:
  '@parcel/watcher': true
  # Only used for source-map upload, which we keep disabled (personal-website's
  # astro.config.mjs) — skip its binary-downloading postinstall.
  '@sentry/cli': false
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  es5-ext: true
  esbuild: true
  # Optional vite peer; its postinstall is not needed to compile anything here.
  less: false
  msw: true
  nx: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
